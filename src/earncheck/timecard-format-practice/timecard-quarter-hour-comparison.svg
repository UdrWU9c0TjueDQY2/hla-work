<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1510" role="img" aria-labelledby="title desc"><title id="title">7:45 is not 7.45 hours</title><desc id="desc">A 45-minute quarter-hour dial, two minute tracks and four fictional entries explain the difference between hours:minutes and decimal hours. Full equivalent text accompanies this visual.</desc><rect x="0" y="0" width="1200" height="25" rx="0" fill="#285e50"/><text x="70" y="78" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#285e50">HONEST LITTLE APPS / TIMECARD FIELD GUIDE</text><text x="70" y="168" font-family="DejaVu Sans,Arial,sans-serif" font-size="58" font-weight="700" fill="#172c3c">7:45 is not 7.45 hours.</text><text x="70" y="217" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#172c3c">Same digits. Different duration. Read the column label before comparing a</text><text x="70" y="252" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#172c3c">timecard.</text><rect x="60" y="286" width="1080" height="280" rx="18" fill="#e4ead7"/><text x="90" y="332" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#285e50">HOURS : MINUTES</text><text x="90" y="394" font-family="DejaVu Sans,Arial,sans-serif" font-size="40" font-weight="700" fill="#172c3c">7 hours + 45 minutes</text><text x="90" y="448" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="400" fill="#172c3c">45 ÷ 60 = 3/4 = 0.75 hour</text><text x="90" y="513" font-family="DejaVu Sans,Arial,sans-serif" font-size="35" font-weight="700" fill="#285e50">7:45 = 7.75 decimal hours</text><circle cx="978" cy="423" r="99" fill="#f6f3ea"/><path d="M978 423L978 324A99 99 0 1 1 879 423Z" fill="#285e50"/><path d="M978 341L978 324" stroke="#f6f3ea" stroke-width="3"/><path d="M1060 423L1077 423" stroke="#f6f3ea" stroke-width="3"/><path d="M978 505L978 522" stroke="#f6f3ea" stroke-width="3"/><path d="M896 423L879 423" stroke="#f6f3ea" stroke-width="3"/><rect x="925" y="387" width="106" height="72" rx="36" fill="#f6f3ea"/><text x="933" y="427" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#172c3c">45/60</text><text x="70" y="624" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#285e50">COMPARE THE LAST PART OF THE HOUR</text><text x="70" y="707" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="700" fill="#285e50">7:45</text><text x="70" y="735" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#172c3c">45 minutes</text><text x="70" y="822" font-family="DejaVu Sans,Arial,sans-serif" font-size="33" font-weight="700" fill="#963e20">7.45</text><text x="70" y="850" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#172c3c">27 minutes</text><rect x="265" y="680" width="790" height="48" rx="4" fill="#e1e3da"/><rect x="265" y="680" width="592.5" height="48" rx="4" fill="#285e50"/><rect x="265" y="795" width="790" height="48" rx="4" fill="#e1e3da"/><rect x="265" y="795" width="355.5" height="48" rx="4" fill="#963e20"/><path d="M265.0 853L265.0 868" stroke="#172c3c" stroke-width="2"/><text x="252.0" y="892" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#172c3c">0</text><path d="M462.5 853L462.5 868" stroke="#172c3c" stroke-width="2"/><text x="449.5" y="892" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#172c3c">15</text><path d="M660.0 853L660.0 868" stroke="#172c3c" stroke-width="2"/><text x="647.0" y="892" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#172c3c">30</text><path d="M857.5 853L857.5 868" stroke="#172c3c" stroke-width="2"/><text x="844.5" y="892" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#172c3c">45</text><path d="M1055.0 853L1055.0 868" stroke="#172c3c" stroke-width="2"/><text x="1042.0" y="892" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#172c3c">60</text><text x="580" y="931" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#172c3c">Minutes within this hour</text><text x="70" y="989" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#963e20">0.45 × 60 = 27 minutes</text><text x="70" y="1036" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#172c3c">So 7.45 decimal hours = 7 hours 27 minutes, or 447 minutes. 7 hours 45 minutes =</text><text x="70" y="1070" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#172c3c">465 minutes. The difference is 18 minutes.</text><rect x="60" y="1127" width="1080" height="147" rx="14" fill="#e4ead7"/><text x="90" y="1169" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#285e50">FOUR FICTIONAL ENTRIES</text><text x="90" y="1221" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700" fill="#172c3c">4 × (465 − 447) = 72 minutes</text><text x="90" y="1258" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="400" fill="#172c3c">A representation difference — not evidence of a payroll error.</text><text x="70" y="1318" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#172c3c">Ask which number format is used. Keep the original minutes and follow the documented</text><text x="70" y="1347" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="400" fill="#172c3c">rounding convention. These examples convert exactly.</text><path d="M70 1390L1130 1390" stroke="#b7c4ba" stroke-width="2"/><text x="70" y="1430" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#285e50">Honest Little Apps publishes EarnCheck and this free companion.</text><text x="70" y="1465" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#172c3c">Optional iPhone app: apps.apple.com/app/id6798048163</text><text x="70" y="1492" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#172c3c">Arithmetic education; no wage or payroll-accuracy determination.</text><a xlink:href="https://apps.apple.com/us/app/earncheck-shift-pay-tracker/id6798048163"><title>Open EarnCheck on the App Store</title><rect x="1000" y="1365" width="135" height="135" rx="0" fill="#ffffff"/><path d="M1012,1377h3v3h-3ZM1015,1377h3v3h-3ZM1018,1377h3v3h-3ZM1021,1377h3v3h-3ZM1024,1377h3v3h-3ZM1027,1377h3v3h-3ZM1030,1377h3v3h-3ZM1039,1377h3v3h-3ZM1045,1377h3v3h-3ZM1057,1377h3v3h-3ZM1060,1377h3v3h-3ZM1063,1377h3v3h-3ZM1075,1377h3v3h-3ZM1078,1377h3v3h-3ZM1081,1377h3v3h-3ZM1084,1377h3v3h-3ZM1096,1377h3v3h-3ZM1102,1377h3v3h-3ZM1105,1377h3v3h-3ZM1108,1377h3v3h-3ZM1111,1377h3v3h-3ZM1114,1377h3v3h-3ZM1117,1377h3v3h-3ZM1120,1377h3v3h-3ZM1012,1380h3v3h-3ZM1030,1380h3v3h-3ZM1042,1380h3v3h-3ZM1051,1380h3v3h-3ZM1060,1380h3v3h-3ZM1063,1380h3v3h-3ZM1072,1380h3v3h-3ZM1084,1380h3v3h-3ZM1093,1380h3v3h-3ZM1096,1380h3v3h-3ZM1102,1380h3v3h-3ZM1120,1380h3v3h-3ZM1012,1383h3v3h-3ZM1018,1383h3v3h-3ZM1021,1383h3v3h-3ZM1024,1383h3v3h-3ZM1030,1383h3v3h-3ZM1036,1383h3v3h-3ZM1039,1383h3v3h-3ZM1042,1383h3v3h-3ZM1045,1383h3v3h-3ZM1054,1383h3v3h-3ZM1066,1383h3v3h-3ZM1075,1383h3v3h-3ZM1078,1383h3v3h-3ZM1084,1383h3v3h-3ZM1096,1383h3v3h-3ZM1102,1383h3v3h-3ZM1108,1383h3v3h-3ZM1111,1383h3v3h-3ZM1114,1383h3v3h-3ZM1120,1383h3v3h-3ZM1012,1386h3v3h-3ZM1018,1386h3v3h-3ZM1021,1386h3v3h-3ZM1024,1386h3v3h-3ZM1030,1386h3v3h-3ZM1036,1386h3v3h-3ZM1039,1386h3v3h-3ZM1042,1386h3v3h-3ZM1057,1386h3v3h-3ZM1060,1386h3v3h-3ZM1063,1386h3v3h-3ZM1081,1386h3v3h-3ZM1087,1386h3v3h-3ZM1090,1386h3v3h-3ZM1096,1386h3v3h-3ZM1102,1386h3v3h-3ZM1108,1386h3v3h-3ZM1111,1386h3v3h-3ZM1114,1386h3v3h-3ZM1120,1386h3v3h-3ZM1012,1389h3v3h-3ZM1018,1389h3v3h-3ZM1021,1389h3v3h-3ZM1024,1389h3v3h-3ZM1030,13